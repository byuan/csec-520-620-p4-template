# Machine-readable grading rubric for CSEC 520/620: Project 4 (SMS spam, unstructured text).
# Weights sum to 100 and match the Project 4 handout.
# `check` = auto (verified by grade.py), agent (LLM judgment), or both (auto evidence + agent judgment).
version: 1
project: "Project 4: Detecting SMS Spam (unstructured text)"
total_points: 100          # plus up to 10 bonus points (criterion `exploratory_bonus`)
bonus_points: 10

criteria:
  - id: reproducibility
    title: One-command reproducibility
    max_points: 20
    check: both
    guidance: >
      `make reproduce` (or `python -m src.run --config config.yaml`) runs from a clean environment
      and writes results/metrics.json plus figures with no manual intervention, after the documented
      data download. See auto checks: reproduce_runs, metrics_present.

  - id: text_and_classifiers
    title: Text processing & classifiers
    max_points: 30
    check: both
    guidance: >
      TF-IDF/count features are built correctly (vocabulary and IDF fitted on training text only).
      The student genuinely implemented multinomial Naive Bayes in NaiveBayesScratch (class priors,
      add-alpha smoothing, log-space scoring, normalized posteriors), NOT a library call;
      config.yaml must set naive_bayes.implementation: scratch, and agreement with the scikit-learn
      reference should be near exact. A linear SVM, KNN (k = 1, 3, 5) and the exploratory k-means
      are run and reported. See auto checks: config_uses_scratch, scratch_implemented,
      no_library_nb_in_scratch, reference_agreement, tests, protocols_run.

  - id: evaluation
    title: Evaluation validity & metrics
    max_points: 25
    check: both
    guidance: >
      Both protocols (paper split and a stratified split) are reported. Precision, recall, F1, MCC,
      Spam Caught and Blocked Ham, plus ROC-AUC / PR-AUC; the all-ham baseline is acknowledged;
      accuracy alone is not used. No leakage: vectorizer, hyperparameters (alpha, C, k) chosen using
      training data only; duplicates handled and explained. Operating point justified by cost.
      See auto checks: metrics_present, leakage_scan, duplicates.

  - id: discussion
    title: Discussion & comparison to the paper
    max_points: 15
    check: agent
    guidance: >
      Insightful, evidence-based comparison with Almeida et al. (2011): where the numbers agree or
      differ and why (duplicates, protocol, preprocessing, SMS length, calibration of Naive Bayes
      probabilities, effect of smoothing incl. alpha = 0). Claims are backed by numbers in
      results/metrics.json, not asserted.

  - id: code_quality
    title: Code quality & repo hygiene
    max_points: 10
    check: both
    guidance: >
      Readable, organized, config-driven (no magic numbers), vectorized where reasonable, no dead code,
      passes lint. Data and results are git-ignored, not committed. SUBMISSION.md filled in.
      See auto check: git_hygiene, report_present.

  - id: exploratory_bonus
    title: "Bonus: exploratory work (Enron-Spam), 10 points = 5 + 5"
    max_points: 10
    bonus: true
    check: both
    parts:
      - id: cross_corpus_transfer
        max_points: 5
        guidance: >
          Enron-Spam obtained and documented (data/README.md); the cross-corpus experiment is run in both
          directions (evaluate.cross_corpus: true -> metrics.json `cross_corpus`) and/or the pipeline is run on
          Enron (data.source: enron); each vectorizer fitted on its own training corpus only (no leakage); metrics
          reported with precision/recall/MCC, not accuracy alone; an evidence-based explanation of why the
          filters transfer or fail (message length, vocabulary, class balance, headers).
      - id: metsis_comparison
        max_points: 5
        guidance: >
          An evidence-based comparison of the student's Enron results (Naive Bayes, and SVM if run) with Metsis,
          Androutsopoulos & Paliouras (2006): which Naive Bayes variants that paper evaluates and how the student's
          multinomial model relates to them, differences in data subsets and evaluation setup, and honest caveats.
    guidance: >
      EXTRA CREDIT on top of the 100 points; never deduct from the 100 for skipping it. Score the two parts above
      (5 + 5). The optional transformer preview earns no points. See auto check: exploratory_enron.

# 620 (graduate) students: hold `evaluation` and `discussion` to a higher bar: run the real corpus
# (not the bundled sample), compare feature variants (n-grams, sublinear tf, LSI), and discuss
# calibration and the cost of blocked ham quantitatively.
